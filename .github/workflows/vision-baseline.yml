name: Vision baseline
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-baseline.txt
      - run: python -m unittest discover -s tests -v
      - run: python -W error -m vision_baseline.validate_results results
      - run: python -W error -m vision_baseline.environment_report --output /tmp/environment-a.json
      - run: python -W error -m vision_baseline.environment_report --output /tmp/environment-b.json
      - run: cmp /tmp/environment-a.json /tmp/environment-b.json
      - run: python -m vision_baseline.demo --checkpoint /tmp/orientation.vtnn
      - run: python -m vision_baseline.infer /tmp/orientation.vtnn examples/vertical_12x12.pgm
      - run: python -m vision_baseline.evaluate --output /tmp/evaluation-a.json
      - run: python -m vision_baseline.evaluate --output /tmp/evaluation-b.json
      - run: cmp /tmp/evaluation-a.json /tmp/evaluation-b.json
      - run: python -m compileall -q vision_baseline tests

